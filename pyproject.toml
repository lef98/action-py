[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "action-py"
version = "0.1.0"
description = "action-py — Python Action Planning Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Leo Fuerbass" }]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/action_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
